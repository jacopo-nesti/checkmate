<!DOCTYPE html>
<html lang="it">

<head>
    <title>CheckMate</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" type="module"></script>
    <script src="{{ url_for('static', filename='tasks.js') }}" type="module"></script>
</head>

<body class="body">
    <div class="container">

        <h1 class="title">Benvenuto {{ current_user.username }}</h1>

        <p class="data"></p>

        <hr>

        <p class="text">Cosa hai da fare oggi?</p>

        <form class="task-form">
            <input
                class="form-input"
                type="text"
                id="taskInput"
                placeholder="scrivi qui..."
            >
        </form>

        <button class="button" type="button" onclick="addTask()">
            Clicca per inviare
        </button>

        <p id="taskFeedback" class="task-feedback" hidden aria-live="polite"></p>

        <p class="text">Vedi cosa devi fare...</p>

        <button class="button" type="button" onclick="window.location.href='/tasks'">
            Visualizza i tuoi compiti
        </button>

        <p class="aforisma">
            Clicca qua sotto per una nuova frase motivazionale!
        </p>

        <button class="button" type="button" onclick="nuovoAforisma()">
            Nuova Motivazione
        </button>

        <p class="text">Già ci abbandoni?</p>
        <a class="button" href="/logout">Logout</a>

        <p class="link">
            <a class="link-chatgpt" href="https://chatgpt.com/">
                Se hai dubbi, chiedi a me!<br>
                E non procrastinare dell'altro...
            </a>
        </p>

        <footer class="site-credit">
            Web Site by
            <a class="site-link" href="https://github.com/jacopo-nesti">
                Jacopo
            </a>
        </footer>

    </div>
</body>

</html>
